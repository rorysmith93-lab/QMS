<svg width="480" height="160" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>RS Engineering logo</title>
  <desc>Mockup logo for RS Engineering featuring a geometric gear-inspired mark and wordmark</desc>

  <!-- Mark: interlocking chevron / gear-inspired badge -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="120" height="120" rx="10" fill="#0F2A44"/>
    <!-- Gear cog outline -->
    <g transform="translate(60,60)">
      <g id="cog">
        <rect x="-6" y="-46" width="12" height="16" fill="#E8912D"/>
        <rect x="-6" y="30" width="12" height="16" fill="#E8912D"/>
        <rect x="-46" y="-6" width="16" height="12" fill="#E8912D"/>
        <rect x="30" y="-6" width="16" height="12" fill="#E8912D"/>
        <g transform="rotate(45)">
          <rect x="-6" y="-46" width="12" height="16" fill="#E8912D"/>
          <rect x="-6" y="30" width="12" height="16" fill="#E8912D"/>
          <rect x="-46" y="-6" width="16" height="12" fill="#E8912D"/>
          <rect x="30" y="-6" width="16" height="12" fill="#E8912D"/>
        </g>
      </g>
      <circle cx="0" cy="0" r="30" fill="#0F2A44" stroke="#E8912D" stroke-width="4"/>
      <circle cx="0" cy="0" r="10" fill="#E8912D"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(160, 55)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0F2A44">RS</text>
    <text x="0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" letter-spacing="3" fill="#E8912D">ENGINEERING</text>
  </g>

  <!-- Underline accent -->
  <rect x="160" y="46" width="200" height="3" fill="#E8912D"/>
</svg>
